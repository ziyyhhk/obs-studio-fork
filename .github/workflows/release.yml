name: Fork release (unsigned)

# Personal fork build of OBS-Studio-Rust (the Rust rewrite of OBS Studio).
# Builds Windows x64 on a hosted runner and attaches the portable ZIP, the
# BETA MSI, the signed update feed, and the AppImage-eligible pieces.
#
# This fork does not start CI on push events, so trigger it by dispatch:
#   gh workflow run release.yml --ref master -f tag=v0.1.2
# (the release tag is created if it does not exist; a `push` of a
# `v*.*.*` tag also works where push events are enabled)
#
# The binaries are NOT signed (no Azure/Apple certificates on this fork),
# so Windows SmartScreen will warn on first run. That is expected.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, e.g. v0.1.2 (created if it does not exist)'
        required: true
        default: 'v0.1.2'

permissions:
  contents: write

concurrency:
  group: fork-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  ENABLE_RUST_LIBOBS: 'ON'
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-windows-x64:
    name: Build Windows x64 (unsigned)
    runs-on: windows-2025-vs2026
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          ref: ${{ github.ref }}
          # Package-Windows.ps1 names packages from `git describe --match '[0-9]*.[0-9]*.[0-9]*'`,
          # which needs full history and upstream's semver tags; a depth-1 checkout has none.
          fetch-depth: 0

      - name: Set up ccache
        shell: pwsh
        run: |
          $Version = '4.14.1'
          $Hash = '6219f3865ca59aec41ee4b678df171d5d35855ecb2b6dbbbd20690b3a68af7b4'
          $Name = "ccache-${Version}-windows-x86_64"
          $Zip = "${env:RUNNER_TEMP}/${Name}.zip"
          Invoke-WebRequest -Uri "https://github.com/ccache/ccache/releases/download/v${Version}/${Name}.zip" -OutFile $Zip
          if ((Get-FileHash -Algorithm SHA256 -Path $Zip).Hash -ne $Hash) { throw 'ccache checksum mismatch' }
          Expand-Archive -Path $Zip -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP $Name >> $env:GITHUB_PATH
          "CCACHE_DIR=${{ github.workspace }}/.ccache" >> $env:GITHUB_ENV
          'CCACHE_MAXSIZE=2G' >> $env:GITHUB_ENV
          'CCACHE_COMPILERCHECK=content' >> $env:GITHUB_ENV
          'CCACHE_SLOPPINESS=include_file_mtime,include_file_ctime' >> $env:GITHUB_ENV

      - name: Set up soldr
        uses: zackees/setup-soldr@d01d9bae0d5a42ceed086dab6f8f272a0c876ac2 # s3 remote cache
        with:
          version: 0.9.45
          build-cache: false
          prebuild-deps-flags: --release
          shims: true
          solo-toolchain-cache: false
        env:
          SOLDR_S3_CACHE_ACCESS_KEY: ${{ secrets.SOLDR_S3_CACHE_ACCESS_KEY }}
          SOLDR_S3_CACHE_SECRET_KEY: ${{ secrets.SOLDR_S3_CACHE_SECRET_KEY }}

      - name: Build OBS-Studio-Rust (Windows x64)
        uses: ./.github/actions/build-obs
        with:
          target: x64
          config: RelWithDebInfo
          rustLibobs: 'ON'

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Package portable ZIP
        uses: ./.github/actions/package-obs
        with:
          target: x64
          config: RelWithDebInfo
          package: 'false'

      - name: Build the MSI installer
        shell: pwsh
        run: uv run --no-project ci/windows_msi.py build --build-dir build_x64 --config RelWithDebInfo

      - name: Collect artifacts
        shell: pwsh
        run: |
          $Version = $env:TAG -replace '^v', ''
          New-Item -ItemType Directory -Force dist | Out-Null
          # The portable ZIP is produced by package-obs (cpack -G ZIP) and verified
          # there; find it wherever it ended up, excluding the symbols archive.
          $Zip = Get-ChildItem -Path . -Recurse -Filter '*-windows-x64.zip' -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch 'symbols' -and $_.FullName -notmatch '\\\.git\\' } |
            Select-Object -First 1
          if (-not $Zip) {
            Write-Output 'collect-artifacts: no portable zip found under the workspace.'
            Get-ChildItem build_x64 | Sort-Object Name | Select-Object Name, Length | Format-Table
            Get-ChildItem . -File | Sort-Object Name | Select-Object Name, Length | Format-Table
            exit 1
          }
          Copy-Item $Zip.FullName -Destination "dist/OBS-Studio-Rust-$Version-windows-x64.zip" -ErrorAction Stop
          $Msi = Get-ChildItem build_x64 '*.msi' | Select-Object -First 1
          if (-not $Msi) { throw 'the MSI was not produced' }
          Copy-Item $Msi.FullName "dist/OBS-Studio-Rust-$Version-windows-x64.msi"
          Get-ChildItem dist

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fork-release-windows-x64
          path: dist/
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build-windows-x64]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fork-release-windows-x64
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: OBS-Studio-Rust fork (ziyyhhk) ${{ inputs.tag || github.ref_name }} - unsigned
          prerelease: true
          files: dist/*
          body: |
            Personal fork build of OBS-Studio-Rust, the Rust rewrite of OBS Studio. NOT the official obs-rust project; not affiliated with it or with the OBS Project. FINAL update - this fork is discontinued; see the README. Windows x64 portable ZIP and BETA MSI installer. Unsigned, so Windows SmartScreen will warn on first run. The in-app update check reads this repo's releases (signed manifest), not the upstream project's.

            Includes the fork-local optimizations: SSE2 UYVX packer kernels (~2.3x on that kernel) and the AVX2 sample_peak volmeter dispatch (both bit-exact against the C oracle). Recording CPU is unchanged (encoder-bound); RAM benefit inherited from upstream. Original upstream repos are credited in the README (obs-rust/obs-studio, obsproject/obs-studio).

            Installing

            - MSI: run OBS-Studio-Rust-0.1.2-windows-x64.msi and pick an install folder.
            - ZIP: unpack anywhere and start bin\64bit\obs64.exe (SmartScreen: More info, Run anyway).
            - Settings live in %APPDATA%\obs-studio-rust and are copied from a normal upstream OBS setup on first launch; nothing overwrites your existing install.
            - The Audio Mixer (in-source dB meters) is already included: View > Docks > Audio Mixer.

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Build the in-app update feed
        run: |
          set -e
          umask 077
          cd dist
          sha256sum OBS-Studio-Rust-*-windows-x64.zip > SHA256SUMS
          cd ..
          printf '%s' "$FORK_UPDATE_RSA_KEY" > /tmp/fork-update-key.pem
          uv run --script ci/fork_update_feed.py --tag "${{ inputs.tag || github.ref_name }}" --assets dist --rsa-key /tmp/fork-update-key.pem --out feed
          shred -u /tmp/fork-update-key.pem || rm -f /tmp/fork-update-key.pem
        env:
          FORK_UPDATE_RSA_KEY: ${{ secrets.FORK_UPDATE_RSA_KEY }}

      - name: Upload the update feed
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          gh release upload "$TAG" feed/manifest.json feed/manifest.json.sig feed/branches.json feed/branches.json.sig --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
